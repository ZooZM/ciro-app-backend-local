name: Deploy NestJS App to VPS

on:
  push:
    branches:
      - main  # Triggers automatically when you push to main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          timeout: 60s
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"  # Ensure node and npm are available on the server
            
            cd /var/www/html/ciro-chat-backend
            
            echo "Pulling latest changes from Git..."
            git pull origin main
            
            echo "Installing production dependencies..."
            npm install
            
            echo "Building the NestJS application..."
            npm run build
            
            echo "Restarting application via PM2..."
            pm2 restart ciro-chat-prod || pm2 start dist/main.js --name "ciro-chat-prod"
            
            echo "Deployment finished successfully!"