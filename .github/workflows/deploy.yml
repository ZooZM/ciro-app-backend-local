name: Deploy NestJS App to VPS via Docker

on:
  push:
    branches:
      - main  # Runs automatically on push to main
  workflow_dispatch: # Allows manually triggering the workflow from GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          MOD_PROVIDER: ${{ secrets.MODERATION_PROVIDER }}
          SIGHT_USER: ${{ secrets.SIGHTENGINE_API_USER }}
          SIGHT_SECRET: ${{ secrets.SIGHTENGINE_API_SECRET }}
          AUTOHIDE_THRESHOLD: ${{ secrets.REEL_REPORT_AUTOHIDE_THRESHOLD }}
          DAILY_LIMIT: ${{ secrets.REEL_REPORT_DAILY_LIMIT }}
          ADMIN_KEY: ${{ secrets.ADMIN_API_KEY }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          timeout: 15m # Increased to 15 minutes because Docker build takes longer
          script_stop: true # Abort on the first failing command
          envs: MOD_PROVIDER,SIGHT_USER,SIGHT_SECRET,AUTOHIDE_THRESHOLD,DAILY_LIMIT,ADMIN_KEY 
          script: |
            cd /var/www/html/ciro-chat-backend

            echo "Fetching latest changes from Git..."
            # Force the server checkout to mirror origin/main exactly. A plain
            # `git pull` fails when the server's local branch has diverged from
            # origin ("Need to specify how to reconcile divergent branches"),
            # which aborts the whole deploy under `script_stop: true`. A hard
            # reset is safe because .env and uploads/ are gitignored (untracked)
            # and so are never touched.
            git fetch origin main
            git reset --hard origin/main
            
            echo "Updating .env file with existing and new Secrets..."
            
            sed -i '/^MODERATION_PROVIDER=/d' .env
            sed -i '/^SIGHTENGINE_API_USER=/d' .env
            sed -i '/^SIGHTENGINE_API_SECRET=/d' .env
            sed -i '/^REEL_REPORT_AUTOHIDE_THRESHOLD=/d' .env
            sed -i '/^REEL_REPORT_DAILY_LIMIT=/d' .env
            sed -i '/^ADMIN_API_KEY=/d' .env
            
           
            echo "MODERATION_PROVIDER=$MOD_PROVIDER" >> .env
            echo "SIGHTENGINE_API_USER=$SIGHT_USER" >> .env
            echo "SIGHTENGINE_API_SECRET=$SIGHT_SECRET" >> .env
            echo "REEL_REPORT_AUTOHIDE_THRESHOLD=$AUTOHIDE_THRESHOLD" >> .env
            echo "REEL_REPORT_DAILY_LIMIT=$DAILY_LIMIT" >> .env
            echo "ADMIN_API_KEY=$ADMIN_KEY" >> .env
            
            echo "Building and deploying containers via Docker Compose..."
            # Rebuilds and restarts only the app container without stopping MongoDB and Redis
            docker compose up -d --build app
            
            echo "Cleaning up unused Docker images to save space..."
            # Remove old dangling images to free disk space on the server
            docker image prune -f
            
            echo "Deployment finished successfully!"