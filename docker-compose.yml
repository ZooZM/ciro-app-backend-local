services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: chat-app-backend:latest
    container_name: chat-app-backend
    restart: unless-stopped
    ports:
      - '3008:3000' # Expose port 3008 on the host, mapped to 3000 inside the container
    env_file:
      - .env
    environment:
      # Connect to MongoDB and Redis via Docker service names on the internal network
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@chat-mongo:27017/${MONGO_DB_NAME}?authSource=admin
      REDIS_URL: redis://chat-redis:6379
    depends_on:
      chat-mongo:
        condition: service_healthy
      chat-redis:
        condition: service_healthy
    volumes:
      # Bind existing server uploads directory so old and new files persist
      - /var/www/html/ciro-chat-backend/uploads:/app/uploads
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - chat-net

  chat-mongo: # Renamed to avoid conflict with the old local setup
    image: mongo:8
    container_name: chat-mongo
    restart: unless-stopped
    # No host ports exposed; runs only on the Docker network (avoids conflict with host port 27017)
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    volumes:
      - ciro_mongodb_data:/data/db # Dedicated volume for chat MongoDB data
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - -u
        - ${MONGO_ROOT_USERNAME}
        - -p
        - ${MONGO_ROOT_PASSWORD}
        - --authenticationDatabase
        - admin
        - --eval
        - "db.adminCommand('ping')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - chat-net

  chat-redis:
    image: redis:7-alpine
    container_name: chat-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ciro_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - chat-net

volumes:
  ciro_mongodb_data:
  ciro_redis_data:

networks:
  chat-net:
    driver: bridge