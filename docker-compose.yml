services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: chat-app-backend:latest
    container_name: chat-app-backend
    restart: unless-stopped
    ports:
      - '3008:3000' # Expose port 3008 on the host, mapped to 3000 inside the container
    env_file:
      - .env
    environment:
      # Connect to MongoDB and Redis via Docker service names on the internal network
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@chat-mongo:27017/${MONGO_DB_NAME}?authSource=admin&replicaSet=rs0
      REDIS_URL: redis://chat-redis:6379
    depends_on:
      chat-mongo:
        condition: service_healthy
      chat-mongo-init-replica:
        condition: service_completed_successfully
      chat-redis:
        condition: service_healthy
    volumes:
      # Bind existing server uploads directory so old and new files persist
      - /var/www/html/ciro-chat-backend/uploads:/app/uploads
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - chat-net

  # 026 (research R2): one-shot. A replica set with auth enabled needs a keyfile.
  # Production cut-over is a scheduled maintenance step: see
  # specs/026-kids-allowance-watch/quickstart.md §6 before deploying this file.
  chat-mongo-keyfile:
    image: mongo:8
    entrypoint:
      - bash
      - -c
      - test -f /keyfile/key || (openssl rand -base64 756 > /keyfile/key && chmod 400 /keyfile/key && chown 999:999 /keyfile/key)
    volumes:
      - ciro_mongo_keyfile:/keyfile
    networks:
      - chat-net

  chat-mongo: # Renamed to avoid conflict with the old local setup
    image: mongo:8
    container_name: chat-mongo
    restart: unless-stopped
    # 026 (research R2): single-node replica set so ledger movements run in transactions.
    command: ['mongod', '--replSet', 'rs0', '--keyFile', '/keyfile/key', '--bind_ip_all']
    depends_on:
      chat-mongo-keyfile:
        condition: service_completed_successfully
    ports:
      - '27018:27017' # 27017 is already taken on the host by another process;
                      # Compass → connect to <server-ip>:27018, auth required
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    volumes:
      - ciro_mongodb_data:/data/db # Dedicated volume for chat MongoDB data
      - ciro_mongo_keyfile:/keyfile
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - -u
        - ${MONGO_ROOT_USERNAME}
        - -p
        - ${MONGO_ROOT_PASSWORD}
        - --authenticationDatabase
        - admin
        - --eval
        - "db.adminCommand('ping')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - chat-net

  # 026 (research R2): one-shot and safe to re-run. Initiates rs0 only if it is not initiated yet.
  chat-mongo-init-replica:
    image: mongo:8
    depends_on:
      chat-mongo:
        condition: service_healthy
    entrypoint:
      - mongosh
      - --host
      - chat-mongo
      - -u
      - ${MONGO_ROOT_USERNAME}
      - -p
      - ${MONGO_ROOT_PASSWORD}
      - --authenticationDatabase
      - admin
      - --quiet
      - --eval
      - "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'chat-mongo:27017'}]}) }"
    networks:
      - chat-net

  chat-redis:
    image: redis:7-alpine
    container_name: chat-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ciro_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - chat-net

volumes:
  ciro_mongodb_data:
  ciro_mongo_keyfile:
  ciro_redis_data:

networks:
  chat-net:
    driver: bridge